<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Focus To-Do Timer • Pro Version</title>
  <!-- SortableJS untuk Drag & Drop -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    :root {
      --bg: #0f0f19;
      --text: #eef2ff;
      --accent: #00d4ff;
      --accent-glow: rgba(0, 212, 255, 0.3);
      --accent-success: #00ce7c;
      --accent-warning: #ffaa00;
      --accent-danger: #ff4d4d;
      --card: #1e1e3a;
      --card-hover: #2a2a45;
      --border: #333355;
      --secondary: #8b8bba;
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    [data-theme="light"] {
      --bg: #f3f4f6;
      --text: #1f2937;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.2);
      --accent-success: #059669;
      --accent-warning: #d97706;
      --accent-danger: #dc2626;
      --card: #ffffff;
      --card-hover: #f9fafb;
      --border: #e5e7eb;
      --secondary: #6b7280;
    }
    
    * { box-sizing: border-box; outline: none; }

    body {
      font-family: var(--font-family);
      font-family:'Inter', sans-serif;

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .container { 
      width: 100%; 
      max-width: 540px; 
      margin: 0 auto; 
      position: relative;
    }

    /* Header & Toggles */
    .top-bar {
      position:relative;
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:30px 0 20px;
    }
    h1 {
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      margin:0;
      font-size:2.8rem;
      color: var(--text);
      text-shadow:0 0 15px var(--accent-glow);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:800px;
      text-align:center;
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
      color: var(--text);
    }
    .icon-btn:hover { transform: scale(1.1); border-color: var(--accent); }
    .icon-btn:active { transform: scale(0.95); }

    /* Timer Visuals */
    .timer-wrapper {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 0 auto 30px;
    }
    .task-item.active-task{
      background: rgba(37, 99, 235, 0.12);
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .task-item.active-task{
      animation: activeGlow 1.5s ease infinite alternate;
    }

    @keyframes activeGlow{
      from{ box-shadow:0 0 0 2px var(--accent-glow);}
      to{ box-shadow:0 0 8px 3px var(--accent-glow);}
    }

    .btn-done-active{
      background: #009f00 !important;
      border-color: var(--accent-success);
      color: #fff !important;
      font-weight:700;
      box-shadow:0 2px 8px rgba(0,206,124,0.35);

    }

    .tag{
      display:inline-block;
      padding:2px 8px;
      margin-left:4px;
      border-radius:999px;
      background:var(--accent);
      color:#fff;
      font-size:0.75rem;
      font-weight:600;
    }
    .timer-circle { position: absolute; inset: 0; }
    svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    circle { fill: none; stroke-linecap: round; transition: stroke 0.3s; }
    
    .minutes-bg   { stroke: var(--border); stroke-width: 24; opacity: 0.3; }
    .minutes-prog { 
      stroke: var(--accent); 
      stroke-width: 15; 
      transition: stroke-dashoffset 1s linear, stroke 0.3s; 
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }
    .seconds-bg   { stroke: var(--border); stroke-width: 12; opacity: 0.2; }
    .seconds-prog { 
      stroke: var(--secondary); 
      stroke-width: 4; 
      transition: stroke-dashoffset 1s linear, stroke 0.3s; 
    }
    .continue-popup{
  position:fixed;
  bottom:30px;
  left:50%;
    z-index:9999;
  transform:translateX(-50%);
  background:var(--card);
  border:1px solid var(--border);
  padding:10px 16px;
  border-radius:10px;
  box-shadow:0 6px 20px rgba(0,0,0,0.15);
  display:flex;
  align-items:center;
  gap:10px;
  opacity:0;
  pointer-events:none;
  transition:all 0.3s;
  font-size:0.9rem;
}

.continue-popup.show{
  opacity:1;
  pointer-events:auto;
}

#continueBtn{
  background:var(--accent-success);
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

    .time-display {
      position: absolute;
      top: 50%;
      font-feature-settings: "tnum";
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4.5rem;
      font-weight: 800;
      color: var(--text);
      z-index: 2;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
    }
    .seconds-part {
      font-weight: 400;
      color: var(--secondary);
      font-size: 1em;
    }
    .notes-section{
      margin-top:16px;
      width:100%;
    }

    #focusNotes{
      width:100%;
      min-height:100px;
      resize:vertical;
      padding:10px 12px;
      border-radius:8px;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      font-size:1rem;
      font-family:'Inter', sans-serif;
    }

    /* Controls */
    .controls-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    
    button {
      padding: 10px 16px;
      font-size: 0.9rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: var(--card-hover); transform: translateY(-1px); }
    button:active { transform: translateY(1px); }

    .duration-btn.active { 
      background: var(--accent-success); 
      color: #fff; 
      border-color: var(--accent-success); 
      box-shadow: 0 4px 12px rgba(0, 206, 124, 0.3);
    }
    
    .action-break,
    .action-reset,
    .action-collapse{
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .action-break:hover,
    .action-reset:hover,
    .action-collapse:hover{
      border-color: var(--accent);
      color: var(--accent);
    }

    button{
      border-radius: 6px;

    }
    .timer-wrapper.flash{
      animation: flash 1s ease infinite;
    }

    @keyframes flash{
      0%{transform:scale(1)}
      50%{transform:scale(1.08)}
      100%{transform:scale(1)}
    }
    /* Task Section */
    .task-section {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .task-section.collapsed { 
      max-height: 0; 
      opacity: 0; 
      margin: 0; 
      padding: 0; 
    }

    .task-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    
    button,
    input,
    .task-text{
      font-family:'Inter', sans-serif;
    }
    .btn-add {
      background: var(--accent);
      color: white;
      border: none;
    }

    .btn-retask{
      background:transparent;
      border:1px solid var(--border);
      color:var(--secondary);
    }

    .btn-retask:hover{
      border-color:var(--accent-warning);
      color:var(--accent-warning);
    }

    .btn-retask{
      width:32px;
      height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .task-list { list-style: none; padding: 0; margin: 0; }
    
    .task-item {
      background: var(--card);
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      border: 1px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .task-item:hover { transform: translateY(-2px); border-color: var(--border); }
    .task-item:active { cursor: grabbing; transform: scale(0.99); }
    
    .task-item.done {
      opacity: 0.5;
      background: var(--bg);
      border: 1px dashed var(--border);
    }
    .task-item.done .task-text { text-decoration: line-through; color: var(--secondary); }

    .task-text {
      flex: 1;
      font-size: 1rem;
      margin-right: 12px;
      cursor: pointer;
    }
    
    .task-actions { display: flex; gap: 6px; }
    .task-actions button {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
    }
    .btn-start,
    .btn-edit,
    .btn-delete{
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-start:hover{
      border-color: var(--accent-success);
      color: var(--accent-success);
    }

    .btn-edit:hover{
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-delete:hover{
      border-color: var(--accent-danger);
      color: var(--accent-danger);
    }

    .btn-start:disabled{
      opacity:0.4;
      cursor:not-allowed;
    }
    .task-actions button{
      width:28px;
      height:28px;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .btn-start{
      min-width:60px;
    }
    .task-actions button:hover{
      transform:translateY(-1px);
    }
    /* Animations */
    @keyframes pop { 0% { transform: scale(0.9); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .pop { animation: pop 0.3s ease; }

    /* Drag & Drop Ghost Classes */
    .sortable-ghost { opacity: 0.4; background: var(--border); }
    .sortable-drag { cursor: grabbing; background: var(--card-hover); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    .timer-done{
      animation: timerPulse 1s ease infinite;
    }

    @keyframes timerPulse{
      0%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
      50%{ transform:translate(-50%,-50%) scale(1.1); opacity:0.6; }
      100%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    }





    /* ============================= */
/* MOBILE RESPONSIVE */
/* ============================= */

@media (max-width: 600px){

  body{
    padding:12px;
  }

  .container{
    max-width:100%;
  }

  h1{
    font-size:1.4rem;
    max-width:200px;
  }

  .timer-wrapper{
    width:240px;
    height:240px;
    margin-bottom:20px;
  }

  .time-display{
    font-size:3rem;
  }

  .controls-row{
    gap:6px;
  }

  button{
    padding:8px 10px;
    font-size:0.8rem;
  }

  .task-item{
    padding:10px 12px;
  }

  .task-text{
    font-size:0.9rem;
  }

  .task-actions button{
    padding:4px 6px;
    font-size:0.7rem;
  }

}
</style>
</head>
<body>

  <div class="container">
    <div class="top-bar">

      <h1 id="headerTitle">Halo Endro</h1>
      <div style="width: 90px;"></div> <!-- Spacer for center balance -->
    </div>

    <div class="timer-wrapper">
      <!-- Outer Circle: Minutes -->
      <div class="timer-circle">
        <svg viewBox="0 0 300 300">
          <circle class="minutes-bg" cx="150" cy="150" r="130"></circle>
          <circle class="minutes-prog" id="minutesProg" cx="150" cy="150" r="130"></circle>
        </svg>
      </div>
      <!-- Inner Circle: Seconds -->
      <div class="timer-circle">
        <svg viewBox="0 0 300 300">
          <circle class="seconds-bg" cx="150" cy="150" r="115"></circle>
          <circle class="seconds-prog" id="secondsProg" cx="150" cy="150" r="115"></circle>
        </svg>
      </div>

      <div class="time-display" id="timeDisplay">
        00:<span class="seconds-part">00</span>
      </div>
    </div>

    <div class="controls-row">

    </div>

    <div class="controls-row">

      <button class="duration-btn active pop" data-min="1">1</button>
      <button class="duration-btn pop" data-min="10">10</button>
      <button class="duration-btn pop" data-min="30">30</button>
      <button class="duration-btn pop" data-min="60">60</button>
      <button class="action-break pop" id="breakBtn">Break</button>
      <button class="action-reset pop" id="resetBtn" title="Reset Timer">Reset</button>
      <button class="action-collapse pop" id="collapseBtn">Hide</button>


    </div>

    <div style="text-align: center; margin-bottom: 10px;">
    </div>

    <div class="task-section" id="taskSection">


      <div class="task-input-group">
        <input type="text" id="taskInput" placeholder="Tulis tugas baru di sini... (Enter)">
        <button class="btn-add pop" id="addTask">Add</button>
      </div>
      <ul class="task-list" id="taskList">
        <!-- Tasks will appear here -->
      </ul>

      <div class="notes-section">
        <textarea id="focusNotes" placeholder="Catatan / ide cepat... (autosave)"></textarea>
      </div>
    </div>

  </div>

<div id="continuePopup" class="continue-popup">
  Waktu habis • lanjut 5 menit?
  <button id="continueBtn">LANJUT</button>
</div>



<!-- Audio SFX -->
<audio id="clickSfx" src="https://sragen.netlify.app/sfx-22.mp3"></audio>
<audio id="startSfx" src="https://sragen.netlify.app/sfx-9.mp3"></audio>
<audio id="doneSfx" preload="auto" src="https://sragen.netlify.app/sfx-17.mp3"></audio>
<audio id="editSfx" src="https://sragen.netlify.app/sfx-22.mp3"></audio>

<script>
  "use strict";

// --- Configuration & State ---
  const state = {
    taskId: null,
    timerInterval: null,
    selectedMinutes: 10,
    totalSeconds: 600,
    remainingSeconds: 600,
    isSoundOn: true,
      isStopwatch: false

  };

// --- DOM Elements ---
  const el = {
    html: document.documentElement,
    themeToggle: document.getElementById("themeToggle"),
    headerTitle: document.getElementById("headerTitle"),
    minutesProg: document.getElementById("minutesProg"),
    secondsProg: document.getElementById("secondsProg"),
    timeDisplay: document.getElementById("timeDisplay"),
    taskInput: document.getElementById("taskInput"),
    addTaskBtn: document.getElementById("addTask"),
    taskList: document.getElementById("taskList"),
    collapseBtn: document.getElementById("collapseBtn"),
    taskSection: document.getElementById("taskSection"),
    breakBtn: document.getElementById("breakBtn"),
    resetBtn: document.getElementById("resetBtn"),
    modal: document.getElementById("modalOverlay"),
    modalClose: document.getElementById("modalCloseBtn"),
    modalMessage: document.getElementById("modalMessage"),
    continuePopup: document.getElementById("continuePopup"),
continueBtn: document.getElementById("continueBtn"),
    sfx: {
      click: document.getElementById("clickSfx"),
      start: document.getElementById("startSfx"),
      done: document.getElementById("doneSfx"),
      edit: document.getElementById("editSfx")
    }
  };

// --- Constants ---
  const minCircum = 2 * Math.PI * 130;
  const secCircum = 2 * Math.PI * 115;
  el.minutesProg.style.strokeDasharray = minCircum;
  el.secondsProg.style.strokeDasharray = secCircum;

// --- Helper Functions ---
  function renderHashtags(text){
    return text.replace(/#(\w+)/g, '<span class="tag">#$1</span>');
  }
  function saveTimer() {
    localStorage.setItem("focusTimerState", JSON.stringify({
      remainingSeconds: state.remainingSeconds,
      totalSeconds: state.totalSeconds,
      selectedMinutes: state.selectedMinutes,
      taskId: state.taskId,
      running: !!state.timerInterval,
      timestamp: Date.now()
    }));
  }
  function saveTasks() {
    const tasks = [];
    document.querySelectorAll(".task-item").forEach(li => {
      tasks.push({
        id: li.dataset.id,
        text: li.querySelector(".task-text").textContent,
        done: li.classList.contains("done")
      });
    });
    localStorage.setItem("focusTasks", JSON.stringify(tasks));
  }

  function showContinuePopup(){

  el.continuePopup.classList.add("show");

  setTimeout(()=>{
    el.continuePopup.classList.remove("show");
  },5000);

}

  function loadTasks() {
    const data = localStorage.getItem("focusTasks");
    if (!data) return;

    const tasks = JSON.parse(data);

    tasks.forEach(t => {
      const li = document.createElement("li");
      li.className = "task-item";
      li.dataset.id = t.id;

      li.innerHTML = `
      <span class="task-text">${renderHashtags(t.text)}</span>
      <div class="task-actions">
        <button class="btn-start">▶ MULAI</button>
        <button class="btn-edit">✏️</button>
        <button class="btn-delete">✕</button>
      </div>
      `;

      const startBtn = li.querySelector(".btn-start");
      const editBtn = li.querySelector(".btn-edit");
      const deleteBtn = li.querySelector(".btn-delete");

      startBtn.addEventListener("click", () => startTimer(t.id));
      editBtn.addEventListener("click", () => editTaskName(li));
      deleteBtn.addEventListener("click", () => {

  // jika task sudah selesai → langsung hapus
        if(li.classList.contains("done")){
          li.remove();
          saveTasks();
          return;
        }

  // jika belum selesai → konfirmasi dulu
        if(confirm("Hapus task ini?")){
          li.remove();
          saveTasks();
        }

      });

// klik teks tidak melakukan apa-apa
      const taskText = li.querySelector(".task-text");
      taskText.style.cursor = "default";


    // jika task sudah selesai
      if (t.done) {
        li.classList.add("done");

        startBtn.disabled = true;
        startBtn.style.display = "none";
        editBtn.style.display = "none";

        const retask = document.createElement("button");
        retask.className = "btn-retask";
        retask.textContent = "↺";

        retask.onclick = () => {
          li.classList.remove("done");
          startBtn.disabled = false;
          startBtn.style.display = "";
          editBtn.style.display = "";
          retask.remove();

          el.taskList.prepend(li);
          saveTasks();
        };

        li.querySelector(".task-actions").prepend(retask);
      }

      el.taskList.appendChild(li);
    });

  // pindahkan semua task selesai ke bawah
    document.querySelectorAll(".task-item.done").forEach(li=>{
      el.taskList.appendChild(li);
    });
  }

  function getCssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function playSfx(audio, volume = 0.6) {
    if (!state.isSoundOn) return;
    if (audio) {
      audio.currentTime = 0;
      audio.volume = volume;
    audio.play().catch(() => {}); // Ignore auto-play errors
  }
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updateVisuals() {
  // Update Text
  const min = Math.floor(state.remainingSeconds / 60);
  const sec = state.remainingSeconds % 60;
  el.timeDisplay.innerHTML = `${String(min).padStart(2, '0')}:<span class="seconds-part">${String(sec).padStart(2, '0')}</span>`;

  // Update Circles
  const minPercent = state.remainingSeconds / state.totalSeconds;
  const secPercent = sec / 60;
  
  el.minutesProg.style.strokeDashoffset = minCircum * (1 - minPercent);
  el.secondsProg.style.strokeDashoffset = secCircum * (1 - secPercent);

  // Dynamic Colors based on urgency
  const dangerColor = getCssVar('--accent-danger');
  const warningColor = getCssVar('--accent-warning');
  const secondaryColor = getCssVar('--secondary');
  const accentColor = getCssVar('--accent');

  // Seconds Circle Color
  if (sec <= 10) el.secondsProg.style.stroke = dangerColor;
  else if (sec <= 20) el.secondsProg.style.stroke = warningColor;
  else el.secondsProg.style.stroke = secondaryColor;

  // Minutes Circle Color
  if (state.remainingSeconds <= 60) el.minutesProg.style.stroke = dangerColor;
  else if (state.remainingSeconds <= 300) el.minutesProg.style.stroke = warningColor;
  else el.minutesProg.style.stroke = accentColor;
  
  // Document Title
  document.title = `${formatTime(state.remainingSeconds)} 🔥`;
}

// --- Core Logic ---

function startTimer(taskId = null, resume = false) {
  if (state.timerInterval) clearInterval(state.timerInterval);

  state.isStopwatch = false; // reset stopwatch mode


  // stop efek selesai sebelumnya
  document.querySelector(".timer-wrapper").classList.remove("flash");
  el.timeDisplay.classList.remove("timer-done");

  playSfx(el.sfx.start);

  state.taskId = taskId || null;
// hapus highlight lama
  document.querySelectorAll(".task-item").forEach(li=>{
    li.classList.remove("active-task");
  });

// tandai task aktif
  if(state.taskId){
    const li=document.querySelector(`[data-id="${state.taskId}"]`);
    if(li) li.classList.add("active-task");
  }
  if(state.taskId){
    const li=document.querySelector(`[data-id="${state.taskId}"]`);
    if(li){
      const startBtn = li.querySelector(".btn-start");

      startBtn.textContent = "✓ DONE";
      startBtn.classList.add("btn-done-active");

      startBtn.onclick = () => {
        finishTimer();
      };
    }
  }

  if (!resume) {
    state.remainingSeconds = state.selectedMinutes * 60;
    state.totalSeconds = state.remainingSeconds;
  }

// Update Header Title
  if (state.taskId) {
    const li = document.querySelector(`[data-id="${state.taskId}"]`);
    if (li) {
      el.headerTitle.textContent = li.querySelector(".task-text").textContent;
    }
} else if(el.headerTitle.textContent !== "🔋 Charging") {
  el.headerTitle.textContent = "Halo Endro";
}
  

  updateVisuals();

state.timerInterval = setInterval(() => {

  if(state.isStopwatch){
    state.remainingSeconds++;
  }else{
    state.remainingSeconds--;

    if(state.remainingSeconds <= 0){
      finishTimer();
      state.isStopwatch = true;
      state.remainingSeconds = 0;
    }
  }

  updateVisuals();
  saveTimer();

},1000);
}

function finishTimer() {


  
  const finishedId = state.taskId;
  state.taskId = null;
  document.title = "Waktu Habis! ⌛️";

setTimeout(() => {
  playSfx(el.sfx.done);
}, 50);

// reset circle supaya penuh lagi (agar pulse terlihat)
  el.minutesProg.style.strokeDashoffset = 0;
  el.secondsProg.style.strokeDashoffset = 0;
  el.minutesProg.style.stroke = getCssVar('--secondary');
  el.secondsProg.style.stroke = getCssVar('--secondary');

  const timer = document.querySelector(".timer-wrapper");
  timer.classList.add("flash");

  el.timeDisplay.classList.add("timer-done");

  // Mark task as done if exists
  if (finishedId) {

    const li = document.querySelector(`[data-id="${finishedId}"]`);
    if (!li) return;

    li.classList.add("done");
    li.classList.remove("active-task");

    const startBtn = li.querySelector(".btn-start");
    const editBtn  = li.querySelector(".btn-edit");

    if (startBtn) {
      startBtn.disabled = true;
      startBtn.style.display = "none";
    }

    if (editBtn) {
      editBtn.style.display = "none";
    }

  // buat tombol retask
    if (!li.querySelector(".btn-retask")) {

      const retask = document.createElement("button");
      retask.className = "btn-retask";
      retask.textContent = "↺";
      retask.title = "Retask";

      retask.addEventListener("click", () => {

        li.classList.remove("done");

        if (startBtn) {
          startBtn.disabled = false;
          startBtn.style.display = "";
          startBtn.textContent="▶ MULAI";
          startBtn.classList.remove("btn-done-active");
        }

        if (editBtn) {
          editBtn.style.display = "";
        }

        retask.remove();

        el.taskList.prepend(li);
        saveTasks();
      });

      const actions = li.querySelector(".task-actions");
      if (actions) actions.prepend(retask);
    }

  // pindahkan ke bawah
    el.taskList.appendChild(li);

    saveTasks();
  } else {

    el.headerTitle.textContent = "Halo Endro";
  }
showContinuePopup();
}

function resetTimer() {

  state.isStopwatch = false;

  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
    playSfx(el.sfx.click);
  }
  state.remainingSeconds = state.selectedMinutes * 60;
  state.totalSeconds = state.remainingSeconds;
  state.taskId = null;
  el.headerTitle.textContent = "Halo Endro";
  document.title = "Focus To-Do Timer";
  document.querySelectorAll(".task-item").forEach(li=>{
    li.classList.remove("active-task");
  });


  document.querySelector(".timer-wrapper").classList.remove("flash");
  el.timeDisplay.classList.remove("timer-done");
  saveTasks();

  // hapus semua task yang sudah selesai
  document.querySelectorAll(".task-item.done").forEach(li=>{
    li.remove();
  });

  saveTasks();

  document.querySelectorAll(".btn-start").forEach(btn=>{
    btn.textContent="▶ MULAI";
    btn.classList.remove("btn-done-active");
  });
  updateVisuals();
}

// --- Task Management ---

function addTask() {
  const text = el.taskInput.value.trim().toUpperCase();
  if (!text) return;
  playSfx(el.sfx.click);

  const id = Date.now();
  const li = document.createElement("li");
  li.className = "task-item";
  li.dataset.id = id;
  li.innerHTML = `
<span class="task-text">${renderHashtags(text)}</span>
    <div class="task-actions">
      <button class="btn-start" title="Mulai Fokus">▶ MULAI</button>
      <button class="btn-edit" title="Edit">✏️</button>
      <button class="btn-delete" title="Hapus">✕</button>
    </div>
  `;

  // Event Listeners for Buttons
  const startBtn = li.querySelector(".btn-start");
  startBtn.addEventListener("click", () => startTimer(id));

  const editBtn = li.querySelector(".btn-edit");
  editBtn.addEventListener("click", () => editTaskName(li));

  const deleteBtn = li.querySelector(".btn-delete");
  deleteBtn.addEventListener("click", () => {

    if(li.classList.contains("done")){
      li.remove();
      playSfx(el.sfx.click, 0.4);
      saveTasks();
      return;
    }

    if(confirm("Task belum selesai. Hapus?")){
      li.remove();
      playSfx(el.sfx.click, 0.4);
      saveTasks();
    }

  });



  el.taskList.prepend(li);
  el.taskInput.value = "";
  saveTasks();
}

function loadTimer() {
  const data = localStorage.getItem("focusTimerState");
  if (!data) return;

  const saved = JSON.parse(data);

  state.selectedMinutes = saved.selectedMinutes;
  state.totalSeconds = saved.totalSeconds;
  state.taskId = saved.taskId;

  const elapsed = Math.floor((Date.now() - saved.timestamp) / 1000);
  state.remainingSeconds = saved.remainingSeconds - elapsed;

  if (state.remainingSeconds <= 0) {
    localStorage.removeItem("focusTimerState");
    return;
  }

  updateVisuals();

  if (saved.running) {
    startTimer(saved.taskId, true);
  }
}

function editTaskName(li) {
  playSfx(el.sfx.edit, 0.7);
  const span = li.querySelector(".task-text");
  const oldText = span.textContent;
  
  const input = document.createElement("input");
  input.type = "text";
  input.value = oldText;
  input.className = "edit-input";
  // Copy styles to match
  input.style.cssText = `
    width: 70%; font-size: 1rem; background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: 6px; padding: 4px 8px;
  `;
  
  span.replaceWith(input);
  input.focus();
  input.select();

  function saveEdit() {
    const newSpan = document.createElement("span");
    newSpan.className = "task-text";
    newSpan.textContent = input.value.trim() || oldText;
    


    input.replaceWith(newSpan);
    
    // Update header if currently running
    if (String(state.taskId) === li.dataset.id){
      el.headerTitle.textContent = newSpan.textContent;
    }
    saveTasks();
  }

  input.addEventListener("blur", saveEdit);
  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") saveEdit();
  });
}

// --- Event Listeners UI ---




// Duration Buttons
document.querySelectorAll(".duration-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".duration-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.selectedMinutes = parseInt(btn.dataset.min);
    playSfx(el.sfx.click);
    if (!state.timerInterval) {
      resetTimer(); // Reset display to new duration if not running
    } else {
      startTimer(state.taskId); // Restart immediately if running
    }
  });
});

// Control Buttons

el.continueBtn.addEventListener("click", ()=>{

  el.continuePopup.classList.remove("show");

  state.selectedMinutes = 5;
  state.remainingSeconds = 5 * 60;
  state.totalSeconds = state.remainingSeconds;

  startTimer(state.taskId);

});


el.breakBtn.addEventListener("click", () => {
  document.querySelectorAll(".duration-btn").forEach(b => b.classList.remove("active"));
  state.selectedMinutes = 5;

  el.headerTitle.textContent = "Break";

  startTimer();
});

el.resetBtn.addEventListener("click", resetTimer);

el.collapseBtn.addEventListener("click", () => {

  el.taskSection.classList.toggle("collapsed");
  const isCollapsed = el.taskSection.classList.contains("collapsed");

  el.collapseBtn.textContent = isCollapsed ? "SHOW" : "HIDE";

  // DARK MODE saat hide
  if(isCollapsed){
    el.html.dataset.theme = "dark";
  }else{
    el.html.dataset.theme = "light";
  }

  playSfx(el.sfx.click);
  updateVisuals();
});



// Add Task
el.addTaskBtn.addEventListener("click", addTask);
el.taskInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") addTask();
});

// Drag & Drop
new Sortable(el.taskList, {
  animation: 150,
  ghostClass: "sortable-ghost",
  delay: 100, // Prevent accidental drags on mobile
  delayOnTouchOnly: true,
  onEnd: () => playSfx(el.sfx.click, 0.2)
});

// ===== NOTES AUTOSAVE =====
const notes = document.getElementById("focusNotes");

// load note
const savedNotes = localStorage.getItem("focusNotes");
if(savedNotes){
  notes.value = savedNotes;
}

// autosave
notes.addEventListener("input", ()=>{
  localStorage.setItem("focusNotes", notes.value);
});

// Initialize
updateVisuals();
loadTasks();
loadTimer();

</script>

</body>
